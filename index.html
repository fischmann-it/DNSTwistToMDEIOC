<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNSTwist to MDE IOC Web Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-6">

    <div class="max-w-3xl w-full bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-extrabold text-blue-400 mb-2">DNSTwist to MDE IOC Generator</h1>
        <p class="text-gray-400 mb-6 text-sm">Generate typosquatting variations for MDE Custom Indicators and Tenant Allow/Block Lists (TABL).</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-300">Target Domain</label>
                <input id="targetDomain" type="text" placeholder="example.com" class="w-full bg-gray-700 border border-gray-600 rounded p-3 text-white focus:outline-none focus:border-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-300">Exclude/Whitelist Domains (Comma separated)</label>
                <input id="whitelist" type="text" placeholder="legit-sub.example.com, safe.com" class="w-full bg-gray-700 border border-gray-600 rounded p-3 text-white focus:outline-none focus:border-blue-500">
            </div>

            <button onclick="processDomains()" class="w-full bg-blue-600 hover:bg-blue-500 transition font-bold py-3 px-4 rounded text-white shadow-lg">
                Generate & Export MDE CSVs
            </button>
        </div>

        <div class="mt-8">
            <h3 class="text-lg font-bold text-gray-300 mb-2">Console Output</h3>
            <div id="terminal" class="bg-black p-4 rounded-lg font-mono text-xs text-green-400 h-48 overflow-y-auto border border-gray-800">
                Ready. Enter a domain to begin...
            </div>
        </div>
    </div>

    <script>
        function log(message) {
            const term = document.getElementById('terminal');
            term.innerHTML += `<br>[*] ${message}`;
            term.scrollTop = term.scrollHeight;
        }

        // Lightweight JS implementation of basic DNSTwist algorithms
        function generateTwists(domain) {
            const bits = domain.split('.');
            const name = bits[0];
            const tld = bits.slice(1).join('.');
            const variants = new Set();

            const qwerty = { 'a': 'qwsz', 'b': 'vghn', 'c': 'xdfv', 'd': 'ersfxc', 'e': 'wsdr', 'f': 'rtgvcd', 'g': 'tyhbvf', 'h': 'yujnbg', 'i': 'ujko', 'j': 'uikmnh', 'k': 'iolmj', 'l': 'opk', 'm': 'njk', 'n': 'bhjm', 'o': 'iklp', 'p': 'ol', 'q': 'wa', 'r': 'edft', 's': 'wedxza', 't': 'rfgy', 'u': 'yhji', 'v': 'cfgb', 'w': 'qase', 'x': 'zsdc', 'y': 'tghu', 'z': 'asx' };

            // 1. Omission
            for (let i = 0; i < name.length; i++) {
                variants.add(name.slice(0, i) + name.slice(i + 1) + '.' + tld);
            }

            // 2. Repetition
            for (let i = 0; i < name.length; i++) {
                variants.add(name.slice(0, i + 1) + name[i] + name.slice(i + 1) + '.' + tld);
            }

            // 3. Transposition
            for (let i = 0; i < name.length - 1; i++) {
                variants.add(name.slice(0, i) + name[i+1] + name[i] + name.slice(i + 2) + '.' + tld);
            }

            // 4. Substitution (QWERTY)
            for (let i = 0; i < name.length; i++) {
                const char = name[i];
                if (qwerty[char]) {
                    for (let replacement of qwerty[char]) {
                        variants.add(name.slice(0, i) + replacement + name.slice(i + 1) + '.' + tld);
                    }
                }
            }

            return Array.from(variants).filter(v => v !== domain);
        }

        function processDomains() {
            const domainInput = document.getElementById('targetDomain').value.trim().toLowerCase();
            const whitelistInput = document.getElementById('whitelist').value.split(',').map(d => d.trim().toLowerCase());
            
            if (!domainInput) {
                alert('Please enter a target domain.');
                return;
            }

            document.getElementById('terminal').innerHTML = "[*] Starting permutation engine...";
            
            // Generate Twists
            let mutatedDomains = generateTwists(domainInput);
            log(`Generated ${mutatedDomains.length} variations for ${domainInput}`);

            // Filter Whitelist
            mutatedDomains = mutatedDomains.filter(d => !whitelistInput.includes(d));
            log(`Filtered remaining total: ${mutatedDomains.length} domains.`);

            // Format & Batch (MDE Max limit is 500 rows per CSV)
            const BATCH_SIZE = 500;
            let batchIndex = 1;

            for (let i = 0; i < mutatedDomains.length; i += BATCH_SIZE) {
                const chunk = mutatedDomains.slice(i, i + BATCH_SIZE);
                downloadMDECSV(chunk, `MDE-IOC-Batch-${batchIndex}.csv`);
                log(`Triggered download for MDE-IOC-Batch-${batchIndex}.csv (${chunk.length} items)`);
                batchIndex++;
            }
            log("All operations complete successfully.");
        }

        function downloadMDECSV(domains, filename) {
            // MDE Expected CSV Headers
            let csvContent = "data:text/csv;charset=utf-8,IndicatorType,IndicatorValue,Action,Severity,Title,Description,RecommendedActions,ExpirationTime\n";
            
            domains.forEach(domain => {
                // Formatting according to Microsoft MDE standard criteria
                const row = `Url,${domain},Block,High,Typosquat Protection,Automated blocklist match for protection,Isolate and audit event,`;
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
